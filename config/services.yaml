services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\GalleryBundle\:
        resource: '../src/'
        exclude: '../src/{Contract,Entity,Exception,Field,Message,Model}'

    # The one implementation of the print letters, so a site swapping it only has to redeclare this alias (see CrowdfundingBundle's own EmailServiceInterface for the same shape)
    c975L\GalleryBundle\Service\GalleryPrintEmailInterface: '@c975L\GalleryBundle\Service\GalleryPrintEmail'

    c975L\GalleryBundle\Service\GalleryCustomizationRegistry:
        arguments:
            $providers: !tagged_iterator gallery.customization_provider

    # The labs installed, whichever bundle or app declared them - TaggedInterfacePass tags every implementation, so a site adding its own printer has nothing to wire
    c975L\GalleryBundle\Service\PrintFulfilmentRegistry:
        arguments:
            $drivers: !tagged_iterator gallery.print_fulfilment

    # The automatic galleries installed, same shape - a site gathering its photographs on a rule of its own writes the class and has a gallery of it
    c975L\GalleryBundle\Service\GalleryAutomaticProvider:
        arguments:
            $galleries: !tagged_iterator gallery.automatic_gallery

    # One class, two registries: the public pages' controllers and the EasyAdmin-only ones
    c975L\GalleryBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.script', priority: 100 }
            - { name: 'ui.admin_script' }

    c975L\GalleryBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 100 }

    # Block kinds registered in UiBundle - cacheable: false on both, their templates resolving their content live via gallery_block_*() on entities BlockCacheInvalidationListener does not watch
    gallery.block.categories:
        class: stdClass
        tags:
            - name: ui.block
              kind: gallery_categories
              label: 'label.block_gallery_categories'
              description: 'label.block_gallery_categories_description'
              translation_domain: 'gallery'
              category: 'label.category_gallery'
              form: 'c975L\GalleryBundle\Form\Block\GalleryCategoriesBlockType'
              template: '@c975LGallery/blocks/Categories.html.twig'
              pickable: true
              cacheable: false

    gallery.block.medias:
        class: stdClass
        tags:
            - name: ui.block
              kind: gallery_medias
              label: 'label.block_gallery_medias'
              description: 'label.block_gallery_medias_description'
              translation_domain: 'gallery'
              category: 'label.category_gallery'
              form: 'c975L\GalleryBundle\Form\Block\GalleryMediasBlockType'
              template: '@c975LGallery/blocks/Medias.html.twig'
              pickable: true
              cacheable: false
